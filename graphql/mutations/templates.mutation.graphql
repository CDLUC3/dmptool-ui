mutation ArchiveTemplate($templateId: Int!) {
  archiveTemplate(templateId: $templateId) {
    id
    errors {
      general
      name
      ownerId
    }
    name
  }
}

mutation CreateTemplateVersion($templateId: Int!, $comment: String, $versionType: TemplateVersionType, $latestPublishVisibility: TemplateVisibility!) {
  createTemplateVersion(templateId: $templateId, comment: $comment, versionType: $versionType, latestPublishVisibility: $latestPublishVisibility) {
    errors {
      general
      name
      ownerId
    }
    name
  }
}

mutation AddTemplate($name: String!, $copyFromTemplateId: Int, $copyFromVersionedTemplateId: Int) {
  addTemplate(name: $name, copyFromTemplateId: $copyFromTemplateId, copyFromVersionedTemplateId: $copyFromVersionedTemplateId) {
    id
    errors {
      general
      name
      ownerId
    }
    description
    name
  }
}

mutation UpdateTemplate($templateId: Int!, $name: String!) {
  updateTemplate(templateId: $templateId, name: $name) {
    id
    name
    latestPublishVisibility
    errors {
      general
      name
      description
    }
  }
}

mutation AddTemplateLink($templateId: Int!, $linkType: TemplateLinkType!, $url: String!, $text: String) {
  addTemplateLink(templateId: $templateId, linkType: $linkType, url: $url, text: $text) {
    id
    linkType
    url
    text
    errors {
      general
      linkType
      url
      text
    }
  }
}

mutation UpdateTemplateLink($templateLinkId: Int!, $url: String!, $text: String) {
  updateTemplateLink(templateLinkId: $templateLinkId, url: $url, text: $text) {
    id
    linkType
    url
    text
    errors {
      general
      url
      text
    }
  }
}

mutation RemoveTemplateLink($templateLinkId: Int!) {
  removeTemplateLink(templateLinkId: $templateLinkId) {
    id
    errors {
      general
    }
  }
}
