mutation SaveQuestionDisplayLogic($input: SaveQuestionDisplayLogicInput!) {
  saveQuestionDisplayLogic(input: $input) {
    id
    displayLogicAction
    displayLogicMatchType
    errors {
      general
    }
  }
}

mutation RemoveQuestionDisplayLogic($questionId: Int!) {
  removeQuestionDisplayLogic(questionId: $questionId)
}