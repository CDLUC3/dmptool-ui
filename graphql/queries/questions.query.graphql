query QuestionsDisplayOrder($sectionId: Int!) {
  questions(sectionId: $sectionId) {
    displayOrder
  }
}

query Questions($sectionId: Int!) {
  questions(sectionId: $sectionId) {
    id
    displayOrder
    questionText
    guidanceText
    errors {
      general
    }
    required
    requirementText
    templateId
    json
    sectionId
  }
}

query TriggerQuestionsForQuestion($questionId: Int!) {
  triggerQuestionsForQuestion(questionId: $questionId) {
    id
    displayOrder
    questionText
    guidanceText
    errors {
      general
    }
    required
    requirementText
    templateId
    json
    sectionId
  }
}

query PlanSectionQuestions($sectionId: Int!) {
  questions(sectionId: $sectionId) {
    id
    questionText
    displayOrder
    guidanceText
    requirementText
    sampleText
    sectionId
    templateId
    isDirty
  }
}

query Question($questionId: Int!) {
  question(questionId: $questionId) {
    id
    guidanceText
    errors {
      general
      questionText
      requirementText
      sampleText
      displayOrder
      questionConditionIds
      sectionId
      templateId
    }
    displayOrder
    questionText
    json
    requirementText
    sampleText
    useSampleTextAsDefault
    sectionId
    templateId
    isDirty
    required
    tags {
      id
      description
      name
      slug
    }
    displayLogicAction
    displayLogicMatchType
  }
}

query PublishedQuestions($planId: Int!, $versionedSectionId: Int!) {
  publishedQuestions(planId: $planId, versionedSectionId: $versionedSectionId) {
    id
    questionText
    guidanceText
    requirementText
    sampleText
    useSampleTextAsDefault
    required
    hasAnswer
    questionType
    versionedQuestionId
    customQuestionId
    json
  }
}

query PublishedCustomQuestions($planId: Int!, $versionedCustomSectionId: Int!) {
  publishedCustomQuestions(planId: $planId, versionedCustomSectionId: $versionedCustomSectionId) {
    id
    questionText
    guidanceText
    requirementText
    sampleText
    useSampleTextAsDefault
    required
    hasAnswer
    questionType
    versionedQuestionId
    customQuestionId
    json
  }
}


query PublishedQuestion($versionedQuestionId: Int!) {
  publishedQuestion(versionedQuestionId: $versionedQuestionId) {
    id
    guidanceText
    errors {
      general
      questionText
      requirementText
      sampleText
      displayOrder
      versionedSectionId
    }
    displayOrder
    questionText
    json
    requirementText
    sampleText
    useSampleTextAsDefault
    versionedSectionId
    versionedTemplateId
    required
    ownerAffiliation {
      acronyms
      displayName
      uri
      name
      id
    }
    customizationSampleText
    customizationId
    customizationGuidanceText
    customizationOwnerAffiliation {
      name
      id
      uri
      displayName
    }
  }
}

query PublishedCustomQuestion($versionedCustomQuestionId: Int!) {
  publishedCustomQuestion(versionedCustomQuestionId: $versionedCustomQuestionId) {
    id
    guidanceText
    errors {
      questionText
      general
      json
    }
    pinnedVersionedQuestionType
    pinnedVersionedQuestionId
    ownerAffiliation {
      id
      name
      displayName
      acronyms
      uri
    }
    questionText
    json
    requirementText
    sampleText
    useSampleTextAsDefault
    versionedSectionId
    versionedSectionType
    versionedTemplateCustomizationId
    required
  }
}