query PublicPlanVersionByDMPId($dmpId: String!, $version: String!) {
  publicPlanVersionByDMPId(dmpId: $dmpId, version: $version) {
    isHistoricalVersion
    versionTimestamp
    latestVersionTimestamp
    dmpId
    created
    members {
      name
      orcid
      affiliationName
      isPrimaryContact
      memberRoles {
        id
        label
        uri
      }
    }
    project {
      abstractText
      endDate
      startDate
      title
      researchDomain {
        name
      }
    }
    modified
    registered
    relatedWorkIdentifiers
    title
    visibility
    owner {
      id
      name
      displayName
      uri
      homepage
    }
    answers {
      id
      json
      questionText
    }
    versionedTemplate {
      id
      title
      version
    }
    versions {
      timestamp
      url
    }
    fundings {
      funderName
      funderOpportunityNumber
      funderProjectNumber
      funderUri
      grantId
      status
    }
    relatedWorks {
      id
      workVersion {
        title
        publicationDate
        workType
        publicationVenue
        sourceName
        sourceUrl
        authors {
          givenName
          surname
          full
        }
        work {
          doi
        }
      }
    }
  }
}