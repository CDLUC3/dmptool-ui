query TemplateVersions($templateId: Int!) {
  templateVersions(templateId: $templateId) {
    name
    version
    versionType
    visibility
    created
    comment
    id
    modified
    versionedBy {
      givenName
      surName
      affiliation {
        displayName
      }
      modified
    }
  }
}

query MyVersionedTemplates {
  myVersionedTemplates {
    id
    templateId
    name
    description
    visibility
    bestPractice
    version
    modified
    modifiedById
    modifiedByName
    ownerId
    ownerURI
    ownerDisplayName
    ownerSearchName
  }
}

query PublishedTemplates($paginationOptions: PaginationOptions, $term: String) {
  publishedTemplates(paginationOptions: $paginationOptions, term: $term) {
    limit
    nextCursor
    totalCount
    availableSortFields
    currentOffset
    hasNextPage
    hasPreviousPage
    items {
      id
      templateId
      name
      description
      visibility
      bestPractice
      version
      modified
      modifiedById
      modifiedByName
      ownerId
      ownerURI
      ownerDisplayName
      ownerSearchName
      versionedTemplateCustomizationId
    }
  }
}

query PublishedTemplatesMetaData($paginationOptions: PaginationOptions, $term: String) {
  publishedTemplatesMetaData(paginationOptions: $paginationOptions, term: $term) {
    hasBestPracticeTemplates
    availableAffiliations
  }
}

query CustomizableTemplates($term: String, $paginationOptions: PaginationOptions) {
  customizableTemplates(term: $term, paginationOptions: $paginationOptions){
    items {
      customizationId
      customizationIsDirty
      customizationLastCustomized
      customizationLastCustomizedById
      customizationMigrationStatus
      customizationLastCustomizedByName
      versionedTemplateDescription
      versionedTemplateAffiliationId
      versionedTemplateAffiliationName
      versionedTemplateId
      versionedTemplateName
      versionedTemplateVersion
      versionedTemplateBestPractice
      customizationStatus
      versionedTemplateLastModified
    }
    nextCursor
    totalCount
    limit
  }
}