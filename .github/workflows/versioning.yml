name: Automated Versioning
on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    # ONLY runs if the PR was merged AND the source branch was 'stage'
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'stage'
    #GitHub-hosted runner with Ubuntu
    runs-on: ubuntu-latest 
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Generate GitHub App Token
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
          token: ${{ steps.generate_token.outputs.token }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Determine version bump
        id: bump
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}

        run: |
          if [[ "$LABELS" == *"version:major"* ]]; then
            echo "type=major" >> $GITHUB_OUTPUT
          elif [[ "$LABELS" == *"version:minor"* ]]; then
            echo "type=minor" >> $GITHUB_OUTPUT
          elif [[ "$LABELS" == *"version:patch"* ]]; then
            echo "type=patch" >> $GITHUB_OUTPUT
          else
            echo "type=patch" >> $GITHUB_OUTPUT
          fi

      - name: Bump version
        run: |
          npm version ${{ steps.bump.outputs.type }} --no-git-tag-version

      - name: Get new version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Update changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          {
            echo "## v${VERSION}"
            echo ""
            echo "### Added"
            echo ""
            echo "### Updated"
            echo ""
            echo "### Fixed"
            echo ""
            echo "### Removed"
            echo ""
            echo "### Chore"
            echo ""
            cat CHANGELOG.md
          } > CHANGELOG.tmp

          mv CHANGELOG.tmp CHANGELOG.md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add package.json CHANGELOG.md
          
          git commit -m "chore: release v${{ steps.version.outputs.version }} [skip ci]" || exit 0
          
          git tag -f "v${{ steps.version.outputs.version }}"
          git push origin HEAD:${{ github.event.pull_request.base.ref }}
          git push --tags --force

  sync-stage:
      needs: version
      runs-on: ubuntu-latest
      steps:
      - name: Generate GitHub App Token
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout Stage
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.generate_token.outputs.token }}

      - name: Open sync PR to stage
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          BRANCH="sync/release-v${VERSION}-to-stage"

          # Close any older, still-open sync PRs targeting stage so they don't pile up
          # Filter precisely on headRefName (exact prefix match)
          gh pr list --base stage --state open \
            --json number,headRefName,author \
            --jq '.[] | select(.headRefName | startswith("sync/release-v")) | select(.author.login == "github-actions[bot]" or (.author.login | endswith("[bot]"))) | .number' \
          | while read -r num; do
              echo "Closing stale sync PR #$num"
              gh pr close "$num" --delete-branch || true
            done
          git checkout -B "$BRANCH" origin/stage
          git checkout origin/main -- package.json CHANGELOG.md

          if git diff --cached --quiet; then
            echo "stage already matches main for these files. Nothing to do."
            exit 0
          fi

          git commit -m "chore: sync release v${VERSION} to stage [skip ci]"
          git push origin "$BRANCH" --force

          gh pr create \
            --base stage \
            --head "$BRANCH" \
            --title "chore: sync release v${VERSION} to stage" \
            --body "Automated sync of \`package.json\` and \`CHANGELOG.md\` from \`main\` after release v${VERSION}."

  sync-development:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout development
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.generate_token.outputs.token }}

      - name: Open sync PR to development
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          BRANCH="sync/release-v${VERSION}-to-development"

          # Close any older, still-open sync PRs targeting development so they don't pile up
          # Filter precisely on headRefName (exact prefix match)
          gh pr list --base development --state open \
            --json number,headRefName,author \
            --jq '.[] | select(.headRefName | startswith("sync/release-v")) | select(.author.login == "github-actions[bot]" or (.author.login | endswith("[bot]"))) | .number' \
          | while read -r num; do
              echo "Closing stale sync PR #$num"
              gh pr close "$num" --delete-branch || true
            done
          git checkout -B "$BRANCH" origin/development
          git checkout origin/main -- package.json CHANGELOG.md

          if git diff --cached --quiet; then
            echo "development already matches main for these files. Nothing to do."
            exit 0
          fi

          git commit -m "chore: sync release v${VERSION} to development [skip ci]"
          git push origin "$BRANCH" --force

          gh pr create \
            --base development \
            --head "$BRANCH" \
            --title "chore: sync release v${VERSION} to development" \
            --body "Automated sync of \`package.json\` and \`CHANGELOG.md\` from \`main\` after release v${VERSION}."